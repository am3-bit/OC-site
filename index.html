<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CHARACTER ARCHIVE - Supabase Sync</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 🔑 Supabase の URL と API Key
    const SUPABASE_URL = "https://jqbbntrbvfuyvmffkthp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LiAdmm_808bLL_wWM3Todw_8_QdhDgz";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --accent-color: #6366f1;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #2e333d;
      --danger-color: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; overflow-x: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(15, 17, 21, 0.9); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); }
    h1 { font-size: 16px; letter-spacing: 2px; font-weight: 700; }
    .header-btns { display: flex; gap: 10px; align-items: center; }
    .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 6px; font-weight: bold; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }
    .tabs-bar { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .tab-nav-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-sub); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .tab-nav-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
    .controls-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .sort-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-sub); }
    .sort-select { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    .tag-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .tag-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-sub); padding: 4px 10px; border-radius: 14px; font-size: 11px; white-space: nowrap; cursor: pointer; }
    .tag-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
    .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-item { cursor: pointer; text-align: center; }
    .icon-wrapper { width: 100%; aspect-ratio: 1 / 1; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
    .icon-wrapper:hover { transform: scale(1.03); border-color: var(--accent-color); }
    .icon-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .char-name-label { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .char-ruby-label { font-size: 10px; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
    .section-view { display: none; }
    .section-view.active { display: block; }
    .content-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .section-title { font-size: 11px; letter-spacing: 1px; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
    .relation-builder { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
    .relation-row { display: flex; gap: 8px; align-items: center; }
    #detail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; display: flex; flex-direction: column; gap: 16px; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .modal-header-grid { display: grid; grid-template-columns: 100px 1fr; gap: 14px; align-items: center; }
    .modal-icon-box { width: 100px; height: 100px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); }
    .modal-icon-box img { width: 100%; height: 100%; object-fit: cover; }
    .modal-title-area h2 { font-size: 18px; margin-bottom: 2px; }
    .modal-ruby { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
    .tag-badge-container { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .tag-badge { font-size: 10px; background: rgba(99, 102, 241, 0.2); color: #818cf8; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .profile-details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
    .profile-meta-item { display: flex; gap: 6px; align-items: center; }
    .meta-lbl { color: var(--text-sub); width: 50px; flex-shrink: 0; }
    .meta-val { color: var(--text-main); font-weight: 500; }
    
    .color-picker-wrapper { display: flex; align-items: center; gap: 6px; }
    .color-preview-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); display: inline-block; flex-shrink: 0; }
    .color-input { -webkit-appearance: none; border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; background: none; }
    .color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-input::-webkit-color-swatch { border: 1px solid var(--border-color); border-radius: 50%; }
    
    .text-block-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    .horizontal-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .gallery-thumb { width: 90px; height: 90px; flex-shrink: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); background: #111; cursor: pointer; position: relative; }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .del-img-btn { position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 10px; display: none; }
    .edit-active .del-img-btn { display: block; }
    #image-viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 2000; justify-content: center; align-items: center; touch-action: none; }
    #image-viewer-img { max-width: 95%; max-height: 85vh; object-fit: contain; border-radius: 8px; transition: transform 0.1s ease-out, opacity 0.1s ease-out; }
    .viewer-close-btn { position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.2); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2010; }
    .edit-controls { display: none; margin-top: 10px; flex-direction: column; gap: 6px; }
    .edit-active .edit-controls { display: flex; }
    .text-input, .select-input { background: #111; border: 1px solid var(--border-color); color: #fff; padding: 6px 8px; font-size: 12px; border-radius: 6px; width: 100%; }
    .file-btn { background: var(--accent-color); color: white; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; text-align: center; display: inline-block; font-weight: bold; border: none; }
    .edit-active [contenteditable="true"] { outline: 2px dashed var(--accent-color); outline-offset: 2px; border-radius: 4px; }
    .add-char-btn { display: none; width: 100%; padding: 14px; margin-top: 16px; background: rgba(99, 102, 241, 0.1); border: 2px dashed var(--accent-color); color: var(--accent-color); border-radius: 12px; font-weight: 600; cursor: pointer; }
    .edit-active .add-char-btn { display: block; }
    .del-btn { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 6px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; width: 100%; text-align: center; margin-top: 8px; display: none; }
    .edit-active .del-btn { display: block; }
    .loading-text { font-size: 11px; color: var(--accent-color); font-weight: bold; display: none; margin-top: 4px; }
    
    .modal-relation-list { list-style: none; padding: 0; margin: 0; font-size: 12px; }
    .modal-relation-list li { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; }

    /* イメソンリストスタイル */
    .song-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
    .song-title { font-weight: bold; color: var(--text-main); }
    .song-link { color: var(--accent-color); text-decoration: none; font-size: 11px; }
  </style>
</head>
<body>

  <header>
    <h1>OC DATABASE</h1>
    <div class="header-btns">
      <button class="icon-btn" id="lock-btn" onclick="toggleLock()">🔒 編集ロック</button>
    </div>
  </header>

  <main class="container">
    <div class="tabs-bar">
      <button class="tab-nav-btn active" onclick="switchTab('chars')">キャラクター</button>
      <button class="tab-nav-btn" onclick="switchTab('playlist')">イメソンまとめ</button>
      <button class="tab-nav-btn" onclick="switchTab('relations')">相関図</button>
    </div>

    <section id="chars-section" class="section-view active">
      <div class="controls-bar">
        <div class="sort-row">
          <span>並び替え</span>
          <select class="sort-select" id="sort-select" onchange="renderGrid()">
            <option value="default">追加順 (デフォルト)</option>
            <option value="name-asc">五十音順</option>
            <option value="height-asc">身長順 (低い順)</option>
            <option value="height-desc">身長順 (高い順)</option>
            <option value="birthday-asc">誕生日順</option>
          </select>
        </div>
        <div class="tag-tabs" id="tag-tabs"></div>
      </div>
      <div class="char-grid" id="char-grid"></div>
      <button class="add-char-btn" onclick="addNewCharacter()">+ キャラクターを追加する</button>
    </section>

    <section id="playlist-section" class="section-view"><div id="playlist-container"></div></section>
    
    <!-- 相関図セクション -->
    <section id="relations-section" class="section-view">
      <div class="relation-builder edit-controls">
        <div style="font-size: 12px; font-weight: bold; color: var(--accent-color);">🔗 キャラ同士の関係性を追加・更新</div>
        <div class="relation-row">
          <select class="select-input" id="rel-from"></select>
          <!-- 🌟 追加：矢印の向き選択 (片道 / 双方向) -->
          <select class="select-input" id="rel-dir" style="width: 70px;">
            <option value="one">➔ (片道)</option>
            <option value="both">⇄ (両方)</option>
          </select>
          <select class="select-input" id="rel-to"></select>
        </div>
        <input type="text" class="text-input" id="rel-label" placeholder="関係性 (例: 片思い、両思い、ライバルなど)">
        <button class="file-btn" onclick="saveRelation()">関係性を保存する</button>
      </div>

      <div class="controls-bar" style="margin-bottom: 12px;">
        <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 4px;">表示するキャラクターで絞り込み:</div>
        <div class="tag-tabs" id="rel-filter-tabs"></div>
      </div>

      <div id="relations-container"></div>
    </section>
  </main>

  <div id="detail-modal">
    <div class="modal-card" id="modal-card-box">
      <button class="modal-close" onclick="closeDetailModal()">✕</button>
      <div class="modal-header-grid">
        <div class="modal-icon-box"><img id="m-icon" src="" alt=""></div>
        <div class="modal-title-area">
          <div class="tag-badge-container" id="m-tags-container"></div>
          <div class="modal-ruby" id="m-ruby" contenteditable="false" onblur="saveCurrentModalData()">よみがな</div>
          <h2 id="m-name" contenteditable="false" onblur="saveCurrentModalData()"></h2>
        </div>
      </div>
      <div class="edit-controls">
        <label class="file-btn">📁 アイコン画像を選択<input type="file" accept="image/*" style="display:none" onchange="uploadIconToSupabase(this)"></label>
        <div id="icon-upload-status" class="loading-text">⚡ Supabaseへ送信中...</div>
        <input type="text" class="text-input" id="m-tags-input" placeholder="世界線タグをカンマ(,)区切りで入力" onblur="saveCurrentModalData()">
      </div>
      <div class="profile-details-grid">
        <div class="profile-meta-item"><span class="meta-lbl">年齢:</span><span class="meta-val" id="m-age" contenteditable="false" onblur="saveCurrentModalData()">-</span></div>
        <div class="profile-meta-item"><span class="meta-lbl">身長:</span><span class="meta-val" id="m-height" contenteditable="false" onblur="saveCurrentModalData()">-</span></div>
        <div class="profile-meta-item"><span class="meta-lbl">誕生日:</span><span class="meta-val" id="m-birth" contenteditable="false" onblur="saveCurrentModalData()">-</span></div>
        <div class="profile-meta-item"><span class="meta-lbl">一人称:</span><span class="meta-val" id="m-first" contenteditable="false" onblur="saveCurrentModalData()">-</span></div>
        <div class="profile-meta-item"><span class="meta-lbl">二人称:</span><span class="meta-val" id="m-second" contenteditable="false" onblur="saveCurrentModalData()">-</span></div>
        <div class="profile-meta-item">
          <span class="meta-lbl">イメカラ:</span>
          <div class="color-picker-wrapper">
            <span class="color-preview-dot" id="m-color-dot" style="background-color: transparent;"></span>
            <span class="meta-val" id="m-color" contenteditable="false" onblur="saveCurrentModalData()">-</span>
            <input type="color" class="color-input edit-controls" id="m-color-picker" onchange="onColorPickerChange(this.value)">
          </div>
        </div>
      </div>
      <div>
        <div class="section-title">GALLERY (イラスト)</div>
        <div class="horizontal-scroll" id="m-gallery"></div>
        <div class="edit-controls">
          <label class="file-btn">📁 イラストを追加する<input type="file" accept="image/*" multiple style="display:none" onchange="uploadGalleryToSupabase(this)"></label>
          <div id="gallery-upload-status" class="loading-text">⚡ イラストを送信中...</div>
        </div>
      </div>
      <div><div class="section-title">性格</div><div class="text-block-box" id="m-personality" contenteditable="false" onblur="saveCurrentModalData()"></div></div>
      <div><div class="section-title">設定・背景</div><div class="text-block-box" id="m-setting" contenteditable="false" onblur="saveCurrentModalData()"></div></div>
      
      <!-- 🌟 改修：複数イメソンリスト＆追加フォーム -->
      <div>
        <div class="section-title">🎵 イメソン</div>
        <div id="m-songs-list"></div>
        <div class="edit-controls" style="gap: 6px; margin-top: 8px;">
          <input type="text" class="text-input" id="new-song-title" placeholder="曲名 (例: マルベリー / Be My Guest)">
          <input type="text" class="text-input" id="new-song-url" placeholder="YouTube URLなど (任意)" oninput="autoFillSongTitle(this.value)">
          <button class="file-btn" onclick="addSongToCharacter()">+ イメソンを追加</button>
        </div>
      </div>
      
      <div>
        <div class="section-title">🔗 相関関係 (このキャラに関わるもの)</div>
        <ul class="modal-relation-list" id="m-relations-list"></ul>
      </div>

      <button class="del-btn" onclick="deleteCurrentCharacter()">このキャラクターを削除する</button>
    </div>
  </div>

  <div id="image-viewer-modal">
    <button class="viewer-close-btn" onclick="closeImageViewer()">✕</button>
    <img id="image-viewer-img" src="" alt="">
  </div>

  <script>
    let characters = [];
    let relations = [];
    let isEditMode = false;
    let activeModalId = null;
    let activeTagFilter = 'ALL';
    let activeRelCharFilter = 'ALL';

    async function loadData() {
      try {
        const { data, error } = await supabaseClient.from('characters').select('*');
        if (error) throw error;
        
        if (data && data.length > 0) {
          const found = data.find(row => row.id === 'main_db');
          if (found && found.data) {
            characters = found.data.characters || [];
            relations = found.data.relations || [];
            
            // 旧バージョンのイメソンデータ(文字列)を配列形式に互換変換
            characters.forEach(c => {
              if (typeof c.song === 'string' && c.song.trim() !== '') {
                c.songs = [{ title: c.song, url: c.song.startsWith('http') ? c.song : '' }];
                delete c.song;
              } else if (!c.songs) {
                c.songs = [];
              }
            });
          }
        }
      } catch (e) {
        console.error('Load Error:', e);
        characters = JSON.parse(localStorage.getItem('oc_chars')) || [];
        relations = JSON.parse(localStorage.getItem('oc_rels')) || [];
      }
      renderTagTabs();
      renderGrid();
    }

    async function saveData() {
      localStorage.setItem('oc_chars', JSON.stringify(characters));
      localStorage.setItem('oc_rels', JSON.stringify(relations));

      try {
        const payload = {
          id: 'main_db',
          data: { characters, relations }
        };
        const { error } = await supabaseClient.from('characters').upsert(payload);
        if (error) console.error('Supabase Save Error:', error);
      } catch (e) {
        console.error('Save Exception:', e);
      }
    }

    loadData();

    async function uploadFileToSupabase(file) {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
      const { data, error } = await supabaseClient.storage.from('oc-images').upload(fileName, file);
      if (error) { alert(`画像アップロード失敗: ${error.message}`); throw error; }
      const { data: publicUrlData } = supabaseClient.storage.from('oc-images').getPublicUrl(fileName);
      return publicUrlData.publicUrl;
    }

    async function uploadIconToSupabase(input) {
      if (input.files && input.files[0]) {
        const statusEl = document.getElementById('icon-upload-status');
        statusEl.style.display = 'block';
        try {
          const url = await uploadFileToSupabase(input.files[0]);
          if (activeModalId) {
            const c = characters.find(x => x.id === activeModalId);
            if (c) { c.icon = url; document.getElementById('m-icon').src = url; await saveData(); }
          }
        } finally { statusEl.style.display = 'none'; }
      }
    }

    async function uploadGalleryToSupabase(input) {
      if (!activeModalId || !input.files.length) return;
      const c = characters.find(x => x.id === activeModalId);
      if (!c) return;
      if (!c.gallery) c.gallery = [];
      const statusEl = document.getElementById('gallery-upload-status');
      statusEl.style.display = 'block';
      try {
        for (let i = 0; i < input.files.length; i++) {
          const url = await uploadFileToSupabase(input.files[i]);
          c.gallery.push(url);
        }
        input.value = '';
        renderModalGallery(c.gallery);
        await saveData();
      } finally { statusEl.style.display = 'none'; }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
      if (tabName === 'chars') {
        document.querySelectorAll('.tab-nav-btn')[0].classList.add('active');
        document.getElementById('chars-section').classList.add('active');
        renderTagTabs(); renderGrid();
      } else if (tabName === 'playlist') {
        document.querySelectorAll('.tab-nav-btn')[1].classList.add('active');
        document.getElementById('playlist-section').classList.add('active');
        renderPlaylist();
      } else if (tabName === 'relations') {
        document.querySelectorAll('.tab-nav-btn')[2].classList.add('active');
        document.getElementById('relations-section').classList.add('active');
        populateRelationSelects(); 
        renderRelationFilterTabs();
        renderRelations();
      }
    }

    function getAllTags() {
      const set = new Set();
      characters.forEach(c => (c.tags || []).forEach(t => t.trim() && set.add(t.trim())));
      return ['ALL', ...Array.from(set)];
    }

    function renderTagTabs() {
      const tabsBox = document.getElementById('tag-tabs');
      tabsBox.innerHTML = '';
      getAllTags().forEach(t => {
        const btn = document.createElement('button');
        btn.className = `tag-btn ${activeTagFilter === t ? 'active' : ''}`;
        btn.innerText = t === 'ALL' ? 'すべて' : `#${t}`;
        btn.onclick = () => { activeTagFilter = t; renderTagTabs(); renderGrid(); };
        tabsBox.appendChild(btn);
      });
    }

    function renderRelationFilterTabs() {
      const box = document.getElementById('rel-filter-tabs');
      box.innerHTML = '';
      
      const allBtn = document.createElement('button');
      allBtn.className = `tag-btn ${activeRelCharFilter === 'ALL' ? 'active' : ''}`;
      allBtn.innerText = '全員の相関図';
      allBtn.onclick = () => { activeRelCharFilter = 'ALL'; renderRelationFilterTabs(); renderRelations(); };
      box.appendChild(allBtn);

      characters.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `tag-btn ${activeRelCharFilter === c.id ? 'active' : ''}`;
        btn.innerText = c.name;
        btn.onclick = () => { activeRelCharFilter = c.id; renderRelationFilterTabs(); renderRelations(); };
        box.appendChild(btn);
      });
    }

    function extractNum(str) {
      const m = (str || '').match(/(\d+)/);
      return m ? parseInt(m[1], 10) : 9999;
    }

    function renderGrid() {
      const grid = document.getElementById('char-grid');
      grid.innerHTML = '';
      const sortMode = document.getElementById('sort-select').value;
      let list = activeTagFilter === 'ALL' ? [...characters] : characters.filter(c => (c.tags || []).includes(activeTagFilter));

      if (sortMode === 'name-asc') list.sort((a, b) => (a.ruby || a.name || '').localeCompare(b.ruby || b.name || '', 'ja'));
      else if (sortMode === 'height-asc') list.sort((a, b) => extractNum(a.height) - extractNum(b.height));
      else if (sortMode === 'height-desc') list.sort((a, b) => extractNum(b.height) - extractNum(a.height));
      else if (sortMode === 'birthday-asc') list.sort((a, b) => (a.birth || '').localeCompare(b.birth || ''));
      else list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      list.forEach(c => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.onclick = () => openDetailModal(c.id);
        item.innerHTML = `
          <div class="icon-wrapper"><img src="${c.icon || 'https://via.placeholder.com/150'}"></div>
          <div class="char-name-label">${c.name}</div>
          <div class="char-ruby-label">${c.ruby || ''}</div>
        `;
        grid.appendChild(item);
      });
    }

    // イメソンまとめ表示
    function renderPlaylist() {
      const box = document.getElementById('playlist-container');
      box.innerHTML = '';
      characters.forEach(c => {
        if (c.songs && c.songs.length > 0) {
          const card = document.createElement('div');
          card.className = 'content-card';
          
          let songsHtml = c.songs.map(s => `
            <div style="margin-top:4px;">
              🎵 <strong>${s.title}</strong>
              ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener noreferrer" class="song-link" style="margin-left:8px;">▶ 試聴する</a>` : ''}
            </div>
          `).join('');

          card.innerHTML = `
            <div style="font-weight:bold; font-size:14px; margin-bottom:6px; color:var(--accent-color);">${c.name}</div>
            <div style="color:var(--text-main); font-size:13px; line-height:1.5;">${songsHtml}</div>
          `;
          box.appendChild(card);
        }
      });
      if (box.innerHTML === '') box.innerHTML = `<div style="text-align:center; color:var(--text-sub); margin-top:30px; font-size:13px;">登録されているイメソンはありません</div>`;
    }

    function populateRelationSelects() {
      const fromSel = document.getElementById('rel-from');
      const toSel = document.getElementById('rel-to');
      fromSel.innerHTML = ''; toSel.innerHTML = '';
      characters.forEach(c => {
        fromSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        toSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
      });
    }

    async function saveRelation() {
      const from = document.getElementById('rel-from').value;
      const to = document.getElementById('rel-to').value;
      const dir = document.getElementById('rel-dir').value; // 'one' or 'both'
      const label = document.getElementById('rel-label').value.trim();
      if (from === to) return alert("違うキャラクターを選んでください");
      if (!label) return alert("関係性を入力してください");
      
      const existing = relations.find(r => r.from === from && r.to === to);
      if (existing) {
        existing.label = label;
        existing.dir = dir;
      } else {
        relations.push({ from, to, label, dir });
      }
      await saveData();
      document.getElementById('rel-label').value = '';
      renderRelations();
    }

    // 全体相関図表示
    function renderRelations() {
      const box = document.getElementById('relations-container');
      box.innerHTML = '';

      let displayRels = [...relations];
      if (activeRelCharFilter !== 'ALL') {
        displayRels = relations.filter(r => r.from === activeRelCharFilter || r.to === activeRelCharFilter);
      }

      displayRels.forEach((r) => {
        const idx = relations.indexOf(r);
        const fromChar = characters.find(c => c.id === r.from);
        const toChar = characters.find(c => c.id === r.to);
        if (!fromChar || !toChar) return;
        
        const arrowStr = r.dir === 'both' ? '⇄' : '➔';

        const card = document.createElement('div');
        card.className = 'content-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:13px; font-weight:bold;">
              <span style="color:var(--accent-color);">${fromChar.name}</span> ${arrowStr} <span style="color:var(--accent-color);">${toChar.name}</span>
            </div>
            ${isEditMode ? `<button onclick="deleteRelation(${idx})" style="background:none; border:none; color:var(--danger-color); font-size:11px; cursor:pointer; font-weight:bold;">削除</button>` : ''}
          </div>
          <div style="margin-top:6px; color:var(--text-main); font-size:13px; background:rgba(0,0,0,0.2); padding:8px; border-radius:6px;">${r.label}</div>
        `;
        box.appendChild(card);
      });
      if (box.innerHTML === '') box.innerHTML = `<div style="text-align:center; color:var(--text-sub); margin-top:30px; font-size:13px;">該当する関係性はありません</div>`;
    }

    async function deleteRelation(idx) {
      if (confirm('この関係性を削除しますか？')) {
        relations.splice(idx, 1);
        await saveData();
        renderRelations();
      }
    }

    function openDetailModal(id) {
      activeModalId = id;
      const c = characters.find(x => x.id === id);
      if (!c) return;
      document.getElementById('m-icon').src = c.icon || '';
      document.getElementById('m-name').innerText = c.name || '';
      document.getElementById('m-ruby').innerText = c.ruby || 'よみがな';
      document.getElementById('m-age').innerText = c.age || '-';
      document.getElementById('m-height').innerText = c.height || '-';
      document.getElementById('m-birth').innerText = c.birth || '-';
      document.getElementById('m-first').innerText = c.firstPerson || '-';
      document.getElementById('m-second').innerText = c.secondPerson || '-';
      
      const colorVal = c.color || '-';
      document.getElementById('m-color').innerText = colorVal;
      document.getElementById('m-color-dot').style.backgroundColor = colorVal !== '-' ? colorVal : 'transparent';
      if (colorVal.startsWith('#')) document.getElementById('m-color-picker').value = colorVal;
      
      document.getElementById('m-personality').innerText = c.personality || '';
      document.getElementById('m-setting').innerText = c.setting || '';
      
      const tagContainer = document.getElementById('m-tags-container');
      tagContainer.innerHTML = '';
      (c.tags || []).forEach(t => {
        const b = document.createElement('span'); b.className = 'tag-badge'; b.innerText = `#${t}`; tagContainer.appendChild(b);
      });
      document.getElementById('m-tags-input').value = (c.tags || []).join(', ');
      renderModalGallery(c.gallery || []);

      renderModalSongs(c);
      renderModalRelations(c);

      document.getElementById('detail-modal').style.display = 'flex';
      applyEditableState();
    }

    // モーダル内のイメソン描画
    function renderModalSongs(char) {
      const box = document.getElementById('m-songs-list');
      box.innerHTML = '';
      if (!char.songs) char.songs = [];

      if (char.songs.length === 0) {
        box.innerHTML = '<div style="font-size:12px; color:var(--text-sub); padding:4px 0;">登録されているイメソンはありません</div>';
        return;
      }

      char.songs.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.innerHTML = `
          <div>
            <span class="song-title">🎵 ${s.title}</span>
            ${s.url ? `<br><a href="${s.url}" target="_blank" rel="noopener noreferrer" class="song-link">▶ 試聴する (YouTube等)</a>` : ''}
          </div>
          ${isEditMode ? `<button onclick="deleteSongFromCharacter(${idx})" style="background:none; border:none; color:var(--danger-color); font-size:11px; cursor:pointer; font-weight:bold;">削除</button>` : ''}
        `;
        box.appendChild(item);
      });
    }

    // URL入力時のタイトル自動補完アシスト
    function autoFillSongTitle(val) {
      const titleInput = document.getElementById('new-song-title');
      if (val.startsWith('http') && (!titleInput.value || titleInput.value.startsWith('http'))) {
        titleInput.value = val; // URLが貼られたら一時的にタイトル欄にもセット
      }
    }

    // イメソン追加
    async function addSongToCharacter() {
      if (!activeModalId) return;
      const c = characters.find(x => x.id === activeModalId);
      if (!c) return;

      const titleInput = document.getElementById('new-song-title');
      const urlInput = document.getElementById('new-song-url');
      const title = titleInput.value.trim();
      const url = urlInput.value.trim();

      if (!title) return alert("曲名（またはリンク）を入力してください");

      if (!c.songs) c.songs = [];
      c.songs.push({ title, url });
      await saveData();

      titleInput.value = '';
      urlInput.value = '';
      renderModalSongs(c);
    }

    // イメソン削除
    async function deleteSongFromCharacter(idx) {
      if (!activeModalId) return;
      const c = characters.find(x => x.id === activeModalId);
      if (c && c.songs) {
        c.songs.splice(idx, 1);
        await saveData();
        renderModalSongs(c);
      }
    }

    // モーダル内の個別相関図描画
    function renderModalRelations(char) {
      const listEl = document.getElementById('m-relations-list');
      listEl.innerHTML = '';
      const myRels = relations.filter(r => r.from === char.id || r.to === char.id);

      if (myRels.length === 0) {
        listEl.innerHTML = '<li style="color:var(--text-sub);">関係性の登録はありません</li>';
        return;
      }

      myRels.forEach(r => {
        const li = document.createElement('li');
        const isBoth = r.dir === 'both';

        if (r.from === char.id) {
          const target = characters.find(x => x.id === r.to);
          const arrow = isBoth ? '⇄' : '➔';
          li.innerHTML = `${arrow} <strong style="color:var(--accent-color);">${target ? target.name : '不明'}</strong> へ: [ ${r.label} ] ${isBoth ? '(お互い)' : ''}`;
        } else {
          const target = characters.find(x => x.id === r.from);
          const arrow = isBoth ? '⇄' : '⬅';
          li.innerHTML = `${arrow} <strong style="color:var(--accent-color);">${target ? target.name : '不明'}</strong> から: [ ${r.label} ] ${isBoth ? '(お互い)' : ''}`;
        }
        listEl.appendChild(li);
      });
    }

    async function onColorPickerChange(hexValue) {
      document.getElementById('m-color').innerText = hexValue;
      document.getElementById('m-color-dot').style.backgroundColor = hexValue;
      await saveCurrentModalData();
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').style.display = 'none';
      activeModalId = null;
      renderTagTabs(); renderGrid();
    }

    function renderModalGallery(galleryList) {
      const gBox = document.getElementById('m-gallery');
      gBox.innerHTML = '';
      galleryList.forEach((url, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'gallery-thumb';
        thumb.innerHTML = `<img src="${url}" onclick="openImageViewer('${url}')"><button class="del-img-btn" onclick="deleteGalleryImg(event, ${idx})">✕</button>`;
        gBox.appendChild(thumb);
      });
      if (galleryList.length === 0) gBox.innerHTML = `<div style="font-size:12px; color:var(--text-sub); padding:10px 0;">画像なし</div>`;
    }

    const viewerModal = document.getElementById('image-viewer-modal');
    const viewerImg = document.getElementById('image-viewer-img');
    function openImageViewer(url) { viewerImg.src = url; viewerModal.style.display = 'flex'; }
    function closeImageViewer() { viewerModal.style.display = 'none'; }

    function toggleLock() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('lock-btn');
      if (isEditMode) {
        const pass = prompt("編集パスワードを入力してください (初期: 1234):");
        if (pass === "1234") { 
          btn.innerText = "🔓 編集中"; 
          document.body.classList.add('edit-active'); 
        } else { 
          isEditMode = false; 
          alert("パスワードが違います"); 
        }
      } else { 
        btn.innerText = "🔒 編集ロック"; 
        document.body.classList.remove('edit-active'); 
      }
      applyEditableState();
      renderRelations();
      if (activeModalId) {
        const c = characters.find(x => x.id === activeModalId);
        if (c) renderModalSongs(c);
      }
    }

    function applyEditableState() {
      const editables = ['m-name', 'm-ruby', 'm-age', 'm-height', 'm-birth', 'm-first', 'm-second', 'm-color', 'm-personality', 'm-setting'];
      editables.forEach(id => { const el = document.getElementById(id); if (el) el.contentEditable = isEditMode; });
      document.getElementById('m-color-picker').style.display = isEditMode ? 'inline-block' : 'none';
    }

    async function saveCurrentModalData() {
      if (!activeModalId || !isEditMode) return;
      const c = characters.find(x => x.id === activeModalId);
      if (!c) return;
      c.name = document.getElementById('m-name').innerText;
      c.ruby = document.getElementById('m-ruby').innerText;
      c.age = document.getElementById('m-age').innerText;
      c.height = document.getElementById('m-height').innerText;
      c.birth = document.getElementById('m-birth').innerText;
      c.firstPerson = document.getElementById('m-first').innerText;
      c.secondPerson = document.getElementById('m-second').innerText;
      
      const newColor = document.getElementById('m-color').innerText;
      c.color = newColor;
      document.getElementById('m-color-dot').style.backgroundColor = newColor !== '-' ? newColor : 'transparent';

      c.personality = document.getElementById('m-personality').innerText;
      c.setting = document.getElementById('m-setting').innerText;
      c.tags = document.getElementById('m-tags-input').value.split(',').map(s => s.trim()).filter(s => s.length > 0);
      await saveData();
    }

    async function deleteGalleryImg(event, idx) {
      event.stopPropagation();
      if (!activeModalId) return;
      const c = characters.find(x => x.id === activeModalId);
      if (c && c.gallery) {
        c.gallery.splice(idx, 1);
        await saveData();
        renderModalGallery(c.gallery);
      }
    }

    async function addNewCharacter() {
      const newId = Date.now().toString();
      const newChar = {
        id: newId, createdAt: Date.now(), tags: ["MAIN"],
        name: "新規キャラ", ruby: "しんき きゃら", age: "16歳", height: "160cm", birth: "1月1日",
        firstPerson: "私", secondPerson: "あなた", color: "#6366f1",
        personality: "", setting: "", songs: [],
        icon: "https://via.placeholder.com/150", gallery: []
      };
      characters.push(newChar);
      await saveData();
      renderTagTabs(); renderGrid();
      openDetailModal(newId);
    }

    async function deleteCurrentCharacter() {
      if (!activeModalId) return;
      if (!confirm("本当にこのキャラクターを削除しますか？ (関連する相関関係も一緒に消去されます)")) return;
      
      characters = characters.filter(x => x.id !== activeModalId);
      relations = relations.filter(r => r.from !== activeModalId && r.to !== activeModalId);
      
      await saveData();
      closeDetailModal();
    }
  </script>
</body>
</html>
