<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Database</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #4a90e2;
            --border-color: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        .status { font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; background: #e0e0e0; }
        .status.online { background: #e6f4ea; color: #137333; }
        .status.error { background: #fce8e6; color: #c5221f; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; }
        .sort-select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
            font-size: 0.9rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid var(--border-color);
            position: relative;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
        }
        .card h3 { margin: 10px 0 4px 0; font-size: 1.1rem; }
        .profile-info { font-size: 0.85rem; color: #555; margin-bottom: 6px; font-weight: bold; }
        .card p { margin: 0; font-size: 0.9rem; color: #666; white-space: pre-wrap; }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; font-weight: bold; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CHARACTERS</h1>
        <div id="status" class="status">🔄 読み込み中...</div>
    </header>

    <div class="controls">
        <button id="addBtn" onclick="openModal()">+ キャラ追加</button>
        <button id="lockBtn" onclick="toggleLock()">🔒 編集ロック中</button>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 0.85rem; font-weight: bold;">並び替え:</span>
            <select id="sortSelect" class="sort-select" onchange="render()">
                <option value="default">登録順</option>
                <option value="ageAsc">年齢順 (若い順)</option>
                <option value="ageDesc">年齢順 (年上順)</option>
            </select>
        </div>
    </div>

    <div id="characterGrid" class="grid"></div>
</div>

<!-- Modal Form -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">キャラ追加</h2>
        <div class="form-group">
            <label>名前</label>
            <input type="text" id="nameInput">
        </div>
        <div class="form-group">
            <label>年齢 (例: 17歳、不詳 など)</label>
            <input type="text" id="ageInput">
        </div>
        <div class="form-group">
            <label>身長・その他プロフィール (例: 170cm)</label>
            <input type="text" id="profileInput">
        </div>
        <div class="form-group">
            <label>詳細・メモ</label>
            <textarea id="descInput" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>画像</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
            <button onclick="closeModal()" style="background: #ccc;">キャンセル</button>
            <button id="saveBtn" onclick="saveCharacter()">保存する</button>
        </div>
    </div>
</div>

<script>
    // ★★★ ご自身の JSONBin 情報に書き換えてください ★★★
    const JSONBIN_BIN_ID = "6aed9ed3ac6210605a71bd33";
    const JSONBIN_API_KEY = "$2a$10$1eWgkJHizXiQFkFZvNQ6e.VvMi2ten4wEDnBdsdgX7.3Xbn3Jar2u";

    let dbData = { characters: [], relations: [] };
    let isUnlocked = false;

    window.onload = () => {
        loadData();
    };

    async function loadData() {
        const statusEl = document.getElementById('status');
        statusEl.className = 'status';
        statusEl.innerText = '🔄 読み込み中...';
        
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            });
            if (!res.ok) throw new Error('通信エラー');
            const data = await res.json();
            dbData = data.record || { characters: [], relations: [] };
            statusEl.className = 'status online';
            statusEl.innerText = '☁ 同期完了';
            render();
        } catch (err) {
            statusEl.className = 'status error';
            statusEl.innerText = '⚠️ オフライン';
            console.error(err);
        }
    }

    async function pushData() {
        const statusEl = document.getElementById('status');
        statusEl.className = 'status';
        statusEl.innerText = '⏳ 保存中...';
        document.getElementById('saveBtn').disabled = true;

        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(dbData)
            });
            if (!res.ok) throw new Error('保存エラー');
            statusEl.className = 'status online';
            statusEl.innerText = '☁ 同期完了';
            render();
        } catch (err) {
            statusEl.className = 'status error';
            statusEl.innerText = '⚠️ 保存失敗';
            console.error(err);
        } finally {
            document.getElementById('saveBtn').disabled = false;
        }
    }

    function render() {
        const grid = document.getElementById('characterGrid');
        const sortType = document.getElementById('sortSelect').value;
        grid.innerHTML = '';

        // データの複製を作成して並び替え
        let chars = [...(dbData.characters || [])];

        if (sortType === 'ageAsc' || sortType === 'ageDesc') {
            chars.sort((a, b) => {
                const ageA = extractNumber(a.age);
                const ageB = extractNumber(b.age);
                if (sortType === 'ageAsc') return ageA - ageB;
                return ageB - ageA;
            });
        }

        chars.forEach((c) => {
            // 元の配列でのインデックスを探す（削除用）
            const index = dbData.characters.indexOf(c);
            const card = document.createElement('div');
            card.className = 'card';
            
            // 年齢とプロフィールの表示文字列を生成
            let subInfoParts = [];
            if (c.age) subInfoParts.push(`年齢: ${c.age}`);
            if (c.profile) subInfoParts.push(c.profile);
            const subInfoText = subInfoParts.join(' / ');

            card.innerHTML = `
                ${c.image ? `<img src="${c.image}" alt="${c.name}">` : '<div style="height:180px;background:#eee;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#aaa;">No Image</div>'}
                <h3>${escapeHtml(c.name)}</h3>
                ${subInfoText ? `<div class="profile-info">${escapeHtml(subInfoText)}</div>` : ''}
                <p>${escapeHtml(c.desc || '')}</p>
                ${isUnlocked ? `<button onclick="deleteChar(${index})" style="background:#e74c3c;padding:4px 8px;font-size:0.75rem;margin-top:8px;">削除</button>` : ''}
            `;
            grid.appendChild(card);
        });
    }

    // 文字列から数字を抽出するヘルパー（「17歳」「17」などを数値化。「不詳」などは9999にして後ろに回す）
    function extractNumber(str) {
        if (!str) return 9999;
        const match = str.match(/\d+/);
        return match ? parseInt(match[0], 10) : 9999;
    }

    // 自動画像圧縮（長辺400px・画質70%）
    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxDim = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxDim) {
                        height *= maxDim / width;
                        width = maxDim;
                    } else if (height > maxDim) {
                        width *= maxDim / height;
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    async function saveCharacter() {
        if (!isUnlocked) {
            alert('編集するには画面上の南京錠ボタンを押してロックを解除してください。');
            return;
        }
        const name = document.getElementById('nameInput').value.trim();
        const age = document.getElementById('ageInput').value.trim();
        const profile = document.getElementById('profileInput').value.trim();
        const desc = document.getElementById('descInput').value.trim();
        const fileInput = document.getElementById('imageInput');

        if (!name) {
            alert('名前を入力してください');
            return;
        }

        let imageData = '';
        if (fileInput.files && fileInput.files[0]) {
            imageData = await compressImage(fileInput.files[0]);
        }

        dbData.characters = dbData.characters || [];
        dbData.characters.push({ name, age, profile, desc, image: imageData });

        closeModal();
        await pushData();
    }

    function deleteChar(index) {
        if (!confirm('本当に削除しますか？')) return;
        dbData.characters.splice(index, 1);
        pushData();
    }

    function toggleLock() {
        if (isUnlocked) {
            isUnlocked = false;
            document.getElementById('lockBtn').innerText = '🔒 編集ロック中';
        } else {
            const pwd = prompt('編集パスワードを入力してください（初期: 1234）');
            if (pwd === '1234') {
                isUnlocked = true;
                document.getElementById('lockBtn').innerText = '🔓 編集モード';
            } else {
                alert('パスワードが違います');
            }
        }
        render();
    }

    function openModal() {
        if (!isUnlocked) {
            alert('編集するには「🔒 編集ロック中」を押してパスワード（1234）を入力してください。');
            return;
        }
        document.getElementById('nameInput').value = '';
        document.getElementById('ageInput').value = '';
        document.getElementById('profileInput').value,value = '';
        document.getElementById('descInput').value = '';
        document.getElementById('imageInput').value = '';
        document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (m) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[m]));
    }
</script>
</body>
</html>
