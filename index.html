<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うちの子図鑑 & 相関図</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #6c5ce7;
      --danger-color: #ff7675;
      --border-radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1, h2 {
      color: var(--accent-color);
      margin: 0;
    }

    .section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }

    /* 編集モードでのみ表示するエリア */
    .edit-only {
      display: none;
    }
    body.editing .edit-only {
      display: block;
    }

    /* フォーム周り */
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-danger {
      background: var(--danger-color);
      padding: 5px 10px;
      font-size: 0.8em;
    }
    .btn-mode {
      background: #b2bec3;
    }
    body.editing .btn-mode {
      background: #e17055;
    }

    /* キャラ一覧グリッド */
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .character-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      position: relative;
    }
    .character-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      background: #eee;
      margin-bottom: 10px;
    }

    /* カラープレビュー表示 */
    .color-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9em;
      margin-top: 4px;
    }
    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.2);
      display: inline-block;
    }

    /* 相関図カード表示 */
    .relation-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .relation-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-color);
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: var(--border-radius);
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      font-size: 1.5em;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎨 うちの子図鑑 & 相関図</h1>
    <button class="btn-mode" id="mode-toggle-btn" onclick="toggleEditMode()">🔒 閲覧モード (編集する)</button>
  </header>

  <!-- 1. 新規キャラ登録（編集モード時のみ表示） -->
  <div class="section edit-only">
    <h2>➕ キャラクター作成</h2>
    <form id="char-form">
      <div class="form-group">
        <label>名前</label>
        <input type="text" id="char-name" required placeholder="例: アリス">
      </div>
      <div class="form-group">
        <label>イメージカラー (カラーコードまたは色名)</label>
        <input type="text" id="char-color" placeholder="例: #ff7675 や red">
      </div>
      <div class="form-group">
        <label>プロフィール・設定</label>
        <textarea id="char-memo" rows="3" placeholder="性格や生い立ちなど"></textarea>
      </div>
      <div class="form-group">
        <label>画像 (任意)</label>
        <input type="file" id="char-file" accept="image/*">
      </div>
      <button type="submit">保存する</button>
    </form>
  </div>

  <!-- 2. キャラ一覧 -->
  <div class="section">
    <h2>👥 キャラクター一覧</h2>
    <div class="character-grid" id="character-list"></div>
  </div>

  <!-- 3. 相関図追加（編集モード時のみ表示） -->
  <div class="section edit-only">
    <h2>🔗 関係性の追加</h2>
    <form id="relation-form">
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <select id="rel-from" required></select>
        <span style="align-self: center;">➡️</span>
        <input type="text" id="rel-label" placeholder="例: ライバル / 幼馴染" required style="flex: 1;">
        <span style="align-self: center;">➡️</span>
        <select id="rel-to" required></select>
      </div>
      <button type="submit" style="margin-top: 15px;">関係を追加</button>
    </form>
  </div>

  <!-- 4. 全体の相関図一覧 -->
  <div class="section">
    <h2>🌐 相関関係一覧</h2>
    <div class="relation-list" id="relation-list"></div>
  </div>
</div>

<!-- 個別閲覧モーダル -->
<div class="modal" id="char-modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    relations: []
  };
