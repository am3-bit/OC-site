<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Database</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 12px;
        }
        h1 { margin: 0; font-size: 1.6rem; letter-spacing: 1px; }
        .status { font-size: 0.85rem; padding: 4px 10px; border-radius: 4px; background: #f0f0f0; }
        .status.online { background: #e6f4ea; color: #137333; }
        .status.error { background: #fce8e6; color: #c5221f; }
        
        /* タブ切り替え */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 4px 4px 0 0;
            background: #f0f0f0;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #333;
            color: #fff;
        }

        .controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        button {
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #fff;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #333; color: #fff; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .sort-select {
            padding: 7px 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background: white;
            font-size: 0.9rem;
        }
        
        .section { display: none; }
        .section.active { display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            background: #f7f7f7;
        }
        .card h3 { margin: 12px 0 4px 0; font-size: 1.2rem; }
        .sub-info { font-size: 0.85rem; color: #666; margin-bottom: 8px; }
        .card p { margin: 0; font-size: 0.9rem; color: #444; white-space: pre-wrap; line-height: 1.4; }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>OC Database</h1>
        <div id="status" class="status">🔄 読み込み中...</div>
    </header>

    <!-- タブ切り替え -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('chars')">キャラクター一覧</button>
        <button class="tab-btn" onclick="switchTab('relations')">相関図</button>
    </div>

    <!-- キャラクターセクション -->
    <div id="charsSection" class="section active">
        <div class="controls">
            <button id="addBtn" onclick="openModal()">+ キャラ追加</button>
            <button id="lockBtn" onclick="toggleLock()">🔒 編集ロック中</button>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 0.85rem;">並び替え:</span>
                <select id="sortSelect" class="sort-select" onchange="render()">
                    <option value="default">登録順</option>
                    <option value="ageAsc">年齢順 (若い順)</option>
                    <option value="ageDesc">年齢順 (年上順)</option>
                </select>
            </div>
        </div>
        <div id="characterGrid" class="grid"></div>
    </div>

    <!-- 相関図セクション -->
    <div id="relationsSection" class="section">
        <div class="controls">
            <button onclick="alert('相関図の編集機能は次のアップデートで追加予定です！')">+ 関係性追加</button>
        </div>
        <div id="relationsContent" style="background:#fff; padding:20px; border:1px solid #e0e0e0; border-radius:6px; min-height:200px;">
            <p style="color:#666; text-align:center; margin:40px 0;">ここに相関図が表示されます。</p>
        </div>
    </div>
</div>

<!-- Modal Form -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0; font-size:1.3rem;">キャラ追加</h2>
        <div class="form-group">
            <label>名前</label>
            <input type="text" id="nameInput">
        </div>
        <div class="form-group">
            <label>年齢</label>
            <input type="text" id="ageInput" placeholder="例: 17歳、不詳 など">
        </div>
        <div class="form-group">
            <label>身長・その他プロフィール</label>
            <input type="text" id="profileInput" placeholder="例: 170cm">
        </div>
        <div class="form-group">
            <label>詳細・メモ</label>
            <textarea id="descInput" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>画像</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px;">
            <button onclick="closeModal()" style="background:#f0f0f0; border-color:#ccc;">キャンセル</button>
            <button id="saveBtn" onclick="saveCharacter()" style="background:#333; color:#fff;">保存する</button>
        </div>
    </div>
</div>

<script>
    // ★★★ ご自身の JSONBin 情報に書き換えてください ★★★
    const JSONBIN_BIN_ID = "6aed9ed3ac6210605a71bd33";
    const JSONBIN_API_KEY = "$2a$10$1eWgkJHizXiQFkFZvNQ6e.VvMi2ten4wEDnBdsdgX7.3Xbn3Jar2u";

    let dbData = { characters: [], relations: [] };
    let isUnlocked = false;

    window.onload = () => {
        loadData();
    };

    async function loadData() {
        const statusEl = document.getElementById('status');
        statusEl.className = 'status';
        statusEl.innerText = '🔄 読み込み中...';
        
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            });
            if (!res.ok) throw new Error('通信エラー');
            const data = await res.json();
            dbData = data.record || { characters: [], relations: [] };
            statusEl.className = 'status online';
            statusEl.innerText = '☁ 同期完了';
            render();
        } catch (err) {
            statusEl.className = 'status error';
            statusEl.innerText = '⚠️ オフライン';
            console.error(err);
        }
    }

    async function pushData() {
        const statusEl = document.getElementById('status');
        statusEl.className = 'status';
        statusEl.innerText = '⏳ 保存中...';
        document.getElementById('saveBtn').disabled = true;

        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(dbData)
            });
            if (!res.ok) throw new Error('保存エラー');
            statusEl.className = 'status online';
            statusEl.innerText = '☁ 同期完了';
            render();
        } catch (err) {
            statusEl.className = 'status error';
            statusEl.innerText = '⚠️ 保存失敗';
            console.error(err);
        } finally {
            document.getElementById('saveBtn').disabled = false;
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'chars') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('charsSection').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('relationsSection').classList.add('active');
        }
    }

    function render() {
        const grid = document.getElementById('characterGrid');
        const sortType = document.getElementById('sortSelect').value;
        grid.innerHTML = '';

        let chars = [...(dbData.characters || [])];

        if (sortType === 'ageAsc' || sortType === 'ageDesc') {
            chars.sort((a, b) => {
                const ageA = extractNumber(a.age);
                const ageB = extractNumber(b.age);
                if (sortType === 'ageAsc') return ageA - ageB;
                return ageB - ageA;
            });
        }

        chars.forEach((c) => {
            const index = dbData.characters.indexOf(c);
            const card = document.createElement('div');
            card.className = 'card';
            
            let subInfoParts = [];
            if (c.age) subInfoParts.push(`年齢: ${c.age}`);
            if (c.profile) subInfoParts.push(c.profile);
            const subInfoText = subInfoParts.join(' / ');

            card.innerHTML = `
                ${c.image ? `<img src="${c.image}" alt="${c.name}">` : '<div style="height:200px;background:#f7f7f7;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#bbb;">No Image</div>'}
                <h3>${escapeHtml(c.name)}</h3>
                ${subInfoText ? `<div class="sub-info">${escapeHtml(subInfoText)}</div>` : ''}
                <p>${escapeHtml(c.desc || '')}</p>
                ${isUnlocked ? `<button onclick="deleteChar(${index})" style="background:#fff; color:#c5221f; border-color:#c5221f; padding:3px 8px; font-size:0.75rem; margin-top:10px;">削除</button>` : ''}
            `;
            grid.appendChild(card);
        });
    }

    function extractNumber(str) {
        if (!str) return 9999;
        const match = str.match(/\d+/);
        return match ? parseInt(match[0], 10) : 9999;
    }

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxDim = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxDim) {
                        height *= maxDim / width;
                        width = maxDim;
                    } else if (height > maxDim) {
                        width *= maxDim / height;
                        height = maxDim;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    async function saveCharacter() {
        if (!isUnlocked) {
            alert('編集するには画面上のロックを解除してください。');
            return;
        }
        const name = document.getElementById('nameInput').value.trim();
        const age = document.getElementById('ageInput').value.trim();
        const profile = document.getElementById('profileInput').value.trim();
        const desc = document.getElementById('descInput').value.trim();
        const fileInput = document.getElementById('imageInput');

        if (!name) {
            alert('名前を入力してください');
            return;
        }

        let imageData = '';
        if (fileInput.files && fileInput.files[0]) {
            imageData = await compressImage(fileInput.files[0]);
        }

        dbData.characters = dbData.characters || [];
        dbData.characters.push({ name, age, profile, desc, image: imageData });

        closeModal();
        await pushData();
    }

    function deleteChar(index) {
        if (!confirm('本当に削除しますか？')) return;
        dbData.characters.splice(index, 1);
        pushData();
    }

    function toggleLock() {
        if (isUnlocked) {
            isUnlocked = false;
            document.getElementById('lockBtn').innerText = '🔒 編集ロック中';
        } else {
            const pwd = prompt('編集パスワードを入力してください');
            if (pwd === '1234') {
                isUnlocked = true;
                document.getElementById('lockBtn').innerText = '🔓 編集モード';
            } else {
                alert('パスワードが違います');
            }
        }
        render();
    }

    function openModal() {
        if (!isUnlocked) {
            alert('編集するには「🔒 編集ロック中」を押してパスワード（1234）を入力してください。');
            return;
        }
        document.getElementById('nameInput').value = '';
        document.getElementById('ageInput').value = '';
        document.getElementById('profileInput').value = '';
        document.getElementById('descInput').value = '';
        document.getElementById('imageInput').value = '';
        document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (m) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[m]));
    }
</script>
</body>
</html>
