<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うちの子図鑑 & 相関図</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #6c5ce7;
      --danger-color: #ff7675;
      --border-radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1, h2 {
      text-align: center;
      color: var(--accent-color);
    }

    .section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }

    /* フォーム周り */
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-danger {
      background: var(--danger-color);
      padding: 5px 10px;
      font-size: 0.8em;
    }

    /* キャラ一覧グリッド */
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .character-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      position: relative;
    }
    .character-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      background: #eee;
      margin-bottom: 10px;
    }

    /* カラープレビュー表示 */
    .color-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9em;
      margin-top: 4px;
    }
    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.2);
      display: inline-block;
    }

    /* 相関図カード表示 */
    .relation-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .relation-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-color);
    }

    /* モーダル（キャラ詳細閲覧） */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: var(--border-radius);
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      font-size: 1.5em;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎨 うちの子図鑑 & 相関図</h1>

  <!-- 1. 新規キャラ登録 -->
  <div class="section">
    <h2>➕ キャラクター作成</h2>
    <form id="char-form">
      <div class="form-group">
        <label>名前</label>
        <input type="text" id="char-name" required placeholder="例: アリス">
      </div>
      <div class="form-group">
        <label>イメージカラー (カラーコードまたは色名)</label>
        <input type="text" id="char-color" placeholder="例: #ff7675 や red">
      </div>
      <div class="form-group">
        <label>プロフィール・設定</label>
        <textarea id="char-memo" rows="3" placeholder="性格や生い立ちなど"></textarea>
      </div>
      <div class="form-group">
        <label>画像 (任意)</label>
        <input type="file" id="char-file" accept="image/*">
      </div>
      <button type="submit">保存する</button>
    </form>
  </div>

  <!-- 2. キャラ一覧 -->
  <div class="section">
    <h2>👥 キャラクター一覧</h2>
    <div class="character-grid" id="character-list"></div>
  </div>

  <!-- 3. 相関図追加 -->
  <div class="section">
    <h2>🔗 関係性の追加</h2>
    <form id="relation-form">
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <select id="rel-from" required></select>
        <span style="align-self: center;">➡️</span>
        <input type="text" id="rel-label" placeholder="例: ライバル / 幼馴染" required style="flex: 1;">
        <span style="align-self: center;">➡️</span>
        <select id="rel-to" required></select>
      </div>
      <button type="submit" style="margin-top: 15px;">関係を追加</button>
    </form>
  </div>

  <!-- 4. 全体の相関図一覧 -->
  <div class="section">
    <h2>🌐 相関関係一覧</h2>
    <div class="relation-list" id="relation-list"></div>
  </div>
</div>

<!-- 個別閲覧モーダル -->
<div class="modal" id="char-modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
  // 🔑 Supabase 設定
  const SUPABASE_URL = "https://jqbbntrbfuyvmffkthp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LiAdmm_808bLL_wWM3Todw_8_QdhDgz";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let appData = {
    characters: [],
    relations: []
  };

  // 初期読み込み
  window.onload = async () => {
    await loadData();
  };

  // クラウドからデータ取得
  async function loadData() {
    const { data, error } = await supabaseClient
      .from('characters')
      .select('*')
      .eq('id', 'main_db')
      .single();

    if (data && data.data) {
      appData = data.data;
      if (!appData.relations) appData.relations = [];
    }
    render();
  }

  // クラウドへデータ保存
  async function saveData() {
    const { error } = await supabaseClient
      .from('characters')
      .upsert({ id: 'main_db', data: appData });

    if (error) {
      alert("保存に失敗しました: " + error.message);
    } else {
      render();
    }
  }

  // 画面描画
  function render() {
    renderCharacters();
    renderRelationForm();
    renderRelations();
  }

  // キャラカード表示
  function renderCharacters() {
    const list = document.getElementById('character-list');
    list.innerHTML = '';

    appData.characters.forEach((char, index) => {
      const card = document.createElement('div');
      card.className = 'character-card';

      // カラー表示用要素
      const colorHtml = char.color ? `
        <div class="color-badge">
          <span class="color-dot" style="background-color: ${char.color};"></span>
          <span>${char.color}</span>
        </div>
      ` : '';

      card.innerHTML = `
        <img src="${char.image || 'https://via.placeholder.com/120'}" class="character-img">
        <h3>${char.name}</h3>
        ${colorHtml}
        <button style="margin-top: 10px; width: 100%;" onclick="openModal(${index})">詳細を見る</button>
        <button class="btn-danger" style="margin-top: 5px; width: 100%;" onclick="deleteCharacter(${index})">削除</button>
      `;
      list.appendChild(card);
    });
  }

  // 相関関係のプルダウン更新
  function renderRelationForm() {
    const fromSelect = document.getElementById('rel-from');
    const toSelect = document.getElementById('rel-to');

    const options = appData.characters.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    fromSelect.innerHTML = options;
    toSelect.innerHTML = options;
  }

  // 全体の相関関係表示
  function renderRelations() {
    const list = document.getElementById('relation-list');
    list.innerHTML = '';

    if (appData.relations.length === 0) {
      list.innerHTML = '<p style="text-align: center; color: #888;">関係性はまだ設定されていません。</p>';
      return;
    }

    appData.relations.forEach((rel, index) => {
      const item = document.createElement('div');
      item.className = 'relation-item';
      item.innerHTML = `
        <div>
          <strong>${rel.from}</strong> ➡️ <span style="color: var(--accent-color); font-weight: bold;">[ ${rel.label} ]</span> ➡️ <strong>${rel.to}</strong>
        </div>
        <button class="btn-danger" onclick="deleteRelation(${index})">削除</button>
      `;
      list.appendChild(item);
    });
  }

  // キャラ作成イベント
  document.getElementById('char-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('char-name').value;
    const color = document.getElementById('char-color').value;
    const memo = document.getElementById('char-memo').value;
    const file = document.getElementById('char-file').files[0];

    let imageUrl = '';
    if (file) {
      const fileName = `${Date.now()}_${file.name}`;
      const { data, error } = await supabaseClient.storage.from('oc-images').upload(fileName, file);
      if (data) {
        const { data: urlData } = supabaseClient.storage.from('oc-images').getPublicUrl(fileName);
        imageUrl = urlData.publicUrl;
      }
    }

    appData.characters.push({ name, color, memo, image: imageUrl });
    document.getElementById('char-form').reset();
    await saveData();
  });

  // 関係性追加イベント
  document.getElementById('relation-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const from = document.getElementById('rel-from').value;
    const to = document.getElementById('rel-to').value;
    const label = document.getElementById('rel-label').value;

    appData.relations.push({ from, to, label });
    document.getElementById('rel-label').value = '';
    await saveData();
  });

  // 相関関係の削除
  async function deleteRelation(index) {
    if (confirm('この関係性を削除してもよろしいですか？')) {
      appData.relations.splice(index, 1);
      await saveData();
    }
  }

  // キャラクター削除
  async function deleteCharacter(index) {
    const charName = appData.characters[index].name;
    if (confirm(`${charName} を削除しますか？ (関連する相関図も削除されます)`)) {
      // キャラ削除
      appData.characters.splice(index, 1);
      // 関連する相関関係も一緒に消す
      appData.relations = appData.relations.filter(r => r.from !== charName && r.to !== charName);
      await saveData();
    }
  }

  // 個別閲覧モーダル開く
  function openModal(index) {
    const char = appData.characters[index];
    const modal = document.getElementById('char-modal');
    const modalBody = document.getElementById('modal-body');

    // このキャラが関わる相関一覧を抽出
    const myRelations = appData.relations.filter(r => r.from === char.name || r.to === char.name);

    let relHtml = myRelations.length > 0 ? myRelations.map(r => `
      <li style="margin-bottom: 5px;">
        ${r.from === char.name ? `➡️ <strong>${r.to}</strong> へ: [ ${r.label} ]` : `⬅️ <strong>${r.from}</strong> から: [ ${r.label} ]`}
      </li>
    `).join('') : '<li>関係性の登録はありません。</li>';

    const colorHtml = char.color ? `
      <div class="color-badge" style="margin-bottom: 10px;">
        <span class="color-dot" style="background-color: ${char.color};"></span>
        <span>${char.color}</span>
      </div>
    ` : '';

    modalBody.innerHTML = `
      <div style="text-align: center;">
        <img src="${char.image || 'https://via.placeholder.com/120'}" style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover;">
        <h2>${char.name}</h2>
        ${colorHtml}
      </div>
      <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
      <h4>📝 プロフィール</h4>
      <p style="white-space: pre-wrap; background: #f9f9f9; padding: 10px; border-radius: 8px;">${char.memo || 'メモなし'}</p>
      <h4>🔗 ${char.name} の相関関係</h4>
      <ul>${relHtml}</ul>
    `;

    modal.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('char-modal').style.display = 'none';
  }
</script>

</body>
</html>
